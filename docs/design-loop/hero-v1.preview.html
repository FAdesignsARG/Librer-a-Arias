<title>Arias Hero</title>
<style>
  :root {
    --ink: #151515;
    --surface: #1e1e1e;
    --line: rgba(255, 255, 255, .1);
    --line-strong: rgba(255, 255, 255, .18);
    --gold: #fece01;
    --gold-hi: #ffdc3d;
    --gold-ink: #1a1200;
    --fill: rgba(255, 255, 255, .06);
    --fill-hi: rgba(255, 255, 255, .11);
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #6e6e73;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --dur-relaxed: .44s;
    --dur-slower: .6s;
    --tap: 44px;
  }
  body { background: var(--ink); }
  * { box-sizing: border-box; }
  .page {
    background: var(--ink);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-feature-settings: 'cv11', 'ss01';
    -webkit-font-smoothing: antialiased;
  }
  /* ---------- nav (referencia, no es la pieza en evaluación) ---------- */
  .nav {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-inline: clamp(18px, 4vw, 32px);
    border-bottom: 1px solid transparent;
  }
  .nav__brand { display: flex; align-items: center; gap: 10px; font-weight: 660; letter-spacing: -0.02em; }
  .nav__brand img { width: 30px; height: 30px; border-radius: 50%; }
  .nav__links { display: flex; gap: 22px; font-size: .92rem; color: var(--text-2); }
  .nav__icons { display: flex; gap: 10px; }
  .nav__icons span { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); font-size: .8rem; }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    isolation: isolate;
    text-align: center;
    padding: clamp(72px, 14vw, 128px) 24px clamp(64px, 11vw, 108px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hero__mark {
    width: clamp(96px, 16vw, 128px);
    height: clamp(96px, 16vw, 128px);
    margin-bottom: clamp(20px, 4vw, 30px);
    animation: rise var(--dur-slower) var(--ease-out) both;
  }
  .hero__word {
    width: min(560px, 88vw);
    height: auto;
    animation: rise var(--dur-slower) var(--ease-out) .06s both;
  }
  .hero__actions {
    display: flex;
    gap: 12px;
    margin-top: clamp(40px, 7vw, 56px);
    animation: rise var(--dur-slower) var(--ease-out) .12s both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero__mark, .hero__word, .hero__actions { animation: none; opacity: 1; transform: none; }
  }

  .btn {

  .btn:active { transform: scale(.96); }
