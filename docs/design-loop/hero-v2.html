<title>Arias Hero v2</title>
<style>
  :root {
    --ink: #151515;
    --surface: #1e1e1e;
    --surface-hi: #282828;
    --line: rgba(255, 255, 255, .1);
    --line-strong: rgba(255, 255, 255, .18);
    --gold: #fece01;
    --gold-hi: #ffdc3d;
    --gold-ink: #1a1200;
    --gold-edge: rgba(246, 190, 0, .28);
    --fill: rgba(255, 255, 255, .06);
    --fill-hi: rgba(255, 255, 255, .11);
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #6e6e73;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-pop: cubic-bezier(.34, 1.4, .64, 1);
    --dur-fast: .16s;
    --dur-moderate: .32s;
    --dur-relaxed: .44s;
    --dur-slower: .6s;
    --tap: 44px;
  }
  body { background: var(--ink); }
  * { box-sizing: border-box; }
  .page {
    background: var(--ink);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-feature-settings: 'cv11', 'ss01';
    -webkit-font-smoothing: antialiased;
  }
  img, svg { display: block; max-width: 100%; }

  /* ---------- nav (referencia, no es la pieza en evaluación) ---------- */
  .nav {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-inline: clamp(18px, 4vw, 32px);
    border-bottom: 1px solid transparent;
  }
  .nav__brand { display: flex; align-items: center; gap: 10px; font-weight: 660; letter-spacing: -0.02em; font-size: .98rem; }
  .nav__brand img { width: 30px; height: 30px; border-radius: 50%; }
  .nav__links { display: flex; gap: 22px; font-size: .92rem; color: var(--text-2); }
  @media (max-width: 640px) { .nav__links { display: none; } }
  .nav__icons { display: flex; gap: 10px; }
  .nav__icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    display: grid; place-items: center;
    color: var(--text-2);
    transition: border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-pop);
  }
  .nav__icon-btn svg { width: 18px; height: 18px; flex: none; }
  .nav__icon-btn:hover { border-color: var(--line-strong); color: var(--text); }
  .nav__icon-btn:active { transform: scale(.94); }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    isolation: isolate;
    text-align: center;
    padding: clamp(56px, 11vw, 100px) 24px clamp(72px, 12vw, 116px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero__bg {
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .14;
    filter: blur(2px) saturate(115%);
    transform: scale(1.08);
    mask-image: linear-gradient(to bottom, #000 0%, #000 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 40%, transparent 100%);
  }
  .hero__mark {
    width: clamp(72px, 11vw, 92px);
    height: clamp(72px, 11vw, 92px);
    margin-bottom: clamp(14px, 3vw, 20px);
    animation: rise var(--dur-slower) var(--ease-out) both;
  }
  .hero__word {
    width: min(460px, 78vw);
    height: auto;
    animation: rise var(--dur-slower) var(--ease-out) .06s both;
  }
  /* Separado de la imagen del wordmark a propósito — ver nota en
     src/styles.css .hero__tagline: horneado en la imagen, "El Temu 2.0
     Riojano" se leía "EI TEMU..." en la condensada de mayúsculas. */
  .hero__tagline {
    margin: clamp(6px, 1.4vw, 10px) 0 0;
    text-align: center;
    font-size: clamp(.78rem, 1.6vw, .92rem);
    font-weight: 620;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--gold);
    animation: rise var(--dur-slower) var(--ease-out) .09s both;
  }

  /* ---------- buscador: el mecanismo central de esta ronda ---------- */
  .hero__search-wrap {
    width: min(640px, 100%);
    margin-top: clamp(28px, 5vw, 40px);
    animation: rise var(--dur-slower) var(--ease-out) .13s both;
  }
  .hero__search {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 64px;
    padding: 6px 6px 6px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: border-color var(--dur-moderate) var(--ease-out),
                background var(--dur-moderate) var(--ease-out),
                box-shadow var(--dur-moderate) var(--ease-out);
  }
  .hero__search:hover {
    border-color: var(--line-strong);
  }
  .hero__search:focus-within {
    background: var(--surface-hi);
    border-color: var(--line-strong);
  }
  .hero__search-input:focus-visible,
  .hero__search-submit:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  .hero__search-icon {
    flex: none;
    width: 20px;
    height: 20px;
    color: var(--text-3);
    transition: color var(--dur-fast);
  }
  .hero__search:focus-within .hero__search-icon { color: var(--text-2); }
  .hero__search-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 1.0625rem;
    letter-spacing: -0.011em;
  }
  .hero__search-input::placeholder { color: var(--text-3); }
  .hero__search-submit {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 0;
    background: var(--gold);
    color: var(--gold-ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 8px 20px -8px rgba(254, 206, 1, 0);
    transition: background var(--dur-fast),
                box-shadow var(--dur-moderate) var(--ease-out),
                transform var(--dur-fast) var(--ease-pop);
  }
  .hero__search-submit svg { width: 20px; height: 20px; }
  .hero__search:focus-within .hero__search-submit,
  .hero__search-submit:hover {
    background: var(--gold-hi);
    box-shadow: 0 8px 20px -6px rgba(254, 206, 1, .45);
  }
  .hero__search-submit:active { transform: scale(.94); }

  .hero__search-hints {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin-inline: -24px;
    width: calc(100% + 48px);
    padding: 2px 24px;
    mask-image: linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent);
  }
  .hero__search-hints::-webkit-scrollbar { display: none; }
  @media (min-width: 720px) {
    .hero__search-hints {
      flex-wrap: wrap;
      justify-content: center;
      overflow-x: visible;
      margin-inline: 0;
      width: auto;
      padding: 2px 0;
      mask-image: none;
      -webkit-mask-image: none;
    }
  }
  .hero__hint {
    flex: none;
    scroll-snap-align: start;
    min-height: 44px;
    padding: 5px 16px 5px 5px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    border-radius: 999px;
    background: var(--fill);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: .84rem;
    font-weight: 540;
    letter-spacing: -0.006em;
    cursor: pointer;
    transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-pop);
  }
  .hero__hint-icon {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--surface-hi);
    display: grid;
    place-items: center;
    color: var(--text-2);
    transition: background var(--dur-fast), color var(--dur-fast);
  }
  .hero__hint-icon svg { width: 16px; height: 16px; }
  .hero__hint:hover { background: var(--fill-hi); border-color: var(--line-strong); color: var(--text); }
  .hero__hint:hover .hero__hint-icon { background: var(--fill-hi); color: var(--text); }
  .hero__hint:active { transform: scale(.94); }

  /* ---------- accesos secundarios: ya no compiten con el buscador ---------- */
  .hero__secondary {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: clamp(26px, 4vw, 34px);
    animation: rise var(--dur-slower) var(--ease-out) .19s both;
  }
  .hero__link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    gap: 7px;
    color: var(--text-2);
    font-size: .92rem;
    font-weight: 540;
    letter-spacing: -0.008em;
    text-decoration: none;
    padding: 0 2px;
    border-bottom: 1px solid transparent;
    transition: color var(--dur-fast), border-color var(--dur-fast);
  }
  .hero__link svg { width: 16px; height: 16px; flex: none; }
  .hero__link:hover { color: var(--text); border-color: var(--line-strong); }
  .hero__sep { width: 1px; height: 16px; background: var(--line); flex: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero__mark, .hero__word, .hero__tagline, .hero__search-wrap, .hero__secondary { animation: none; opacity: 1; transform: none; }
    .hero__search, .hero__search-submit, .hero__hint, .nav__icon-btn { transition: none; }
  }

  @media (max-width: 480px) {
    .hero__search { height: 60px; padding-left: 18px; }
    .hero__search-submit { width: 48px; height: 48px; }
    .hero__secondary { gap: 14px; font-size: .9rem; }
  }

  /* siguiente sección, sólo para mostrar el corte de color */
  .next {
    background: var(--surface);
    padding: 22px 24px;
    text-align: center;
    color: var(--text-3);
    font-size: .82rem;
  }
</style>
